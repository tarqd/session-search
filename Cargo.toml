[package]
name = "session-search"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
brush-parser = "0.4.0"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive", "env", "wrap_help"] }
owo-colors = "4.4.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tantivy = "0.26.2"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"

[dev-dependencies]
insta = { version = "1.48.0", features = ["json", "redactions", "filters"] }
tempfile = "3.27.0"
