[package]
name = "session-search"
version = "0.1.0"
edition = "2024"

[features]
default = []
# An HTTP server over the same read operations the CLI exposes, with an Elastic Search UI
# compatible envelope. Off by default: it binds a port and serves your transcripts.
http-api = ["dep:axum", "dep:tokio", "dep:serde_urlencoded"]
# The static single-page frontend, embedded in the binary and served by the same server.
web-ui = ["http-api"]
# An MCP stdio server over the same read operations the CLI exposes. Off by default so the plain
# CLI keeps its dependency footprint and build time; see docs/MCP.md.
mcp = [
  "dep:rmcp",
  "dep:schemars",
  "dep:tokio",
  "tokio/io-std",
  "tokio/macros",
  "tokio/rt-multi-thread",
]

[dependencies]
anyhow = "1.0.104"
brush-parser = "0.4.0"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive", "env", "wrap_help"] }
owo-colors = "4.4.0"
pulldown-cmark = { version = "0.13", default-features = false }
rayon = "1.12.0"
# Already in the tree as a mandatory tantivy dependency, so depending on it directly costs no
# extra compile time and no extra binary size. `slice::grep` needs it: the caller is a model, and
# a "grep" that quietly matched `.*error.*` literally would report a log full of errors as clean.
regex = "1.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tantivy = "0.26.2"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"

# --- optional, `http-api` / `web-ui` ------------------------------------------------------
# `default-features = false` keeps the multipart, form and tower-log machinery out; the server
# needs routing, JSON and query extraction and nothing else.
axum = { version = "0.8.9", optional = true, default-features = false, features = [
  "http1",
  "json",
  "query",
  "tokio",
] }
tokio = { version = "1.49.0", optional = true, default-features = false, features = [
  "rt-multi-thread",
  "net",
  "signal",
] }
# Deserializing a query string into `Vec<(String, String)>` is the one thing `axum::extract::Query`
# cannot do, and repeatable parameters (`?tool=Bash&tool=Read`) need it.
serde_urlencoded = { version = "0.7.1", optional = true }

# --- optional, `mcp` ----------------------------------------------------------------------
# `default-features = false` drops the client side and the HTTP/SSE transports; a stdio server
# needs the server, the `#[tool]` macros, the stdio transport and schema generation.
rmcp = { version = "3.2", optional = true, default-features = false, features = [
  "server",
  "macros",
  "transport-io",
  "schemars",
] }
# `1`, not the `0.8` rmcp's README claims: the `#[tool]` macro expands to schemars 1.x APIs.
schemars = { version = "1", optional = true }

[dev-dependencies]
insta = { version = "1.48.0", features = ["json", "redactions", "filters"] }
tempfile = "3.27.0"
# `ServiceExt::oneshot` drives the router in tests without binding a socket.
tower = { version = "0.5.3", features = ["util"] }
